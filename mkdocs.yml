site_name: Thorsten Panneck-Conradi
site_description: >-
  Verweise auf öffentlich zugängliche Arbeiten zu Cybersicherheit, Sprache,
  Plattform und Verwaltungsdigitalisierung — alle mit einem KI-System entstanden.
site_url: https://tpanneck.github.io/
site_author: Thorsten Panneck-Conradi
copyright: Thorsten Panneck-Conradi · Ittigen bei Bern

theme:
  name: material
  language: de
  font:
    text: Source Sans 3
    code: JetBrains Mono
  icon:
    logo: material/hexagon-outline
  palette:
    # Die Seite folgt der Systemeinstellung; beide Fassungen sind gesetzt,
    # keine erbt die Grundfarbe vom Wirt.
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Dunkle Fassung
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Helle Fassung
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - content.code.copy
    - toc.follow

extra_css:
  - stylesheets/eigenes.css

extra:
  # Bewusst keine Kontaktangaben: keine E-Mail-Adresse, keine Telefonnummer,
  # keine Verfuegbarkeit. Die Seite ist ein Nachschlagewerk fuer Leute, die den
  # Weg zu Thorsten ohnehin schon haben — nicht ein Formular fuer Fremde.
  # `pruefe-oeffentlich.py` haelt das durch.
  generator: false

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.smartsymbols
  - pymdownx.caret
  - pymdownx.mark

nav:
  - Start: index.md
  - Mit KI arbeiten: mit-ki-arbeiten.md
